<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Rentals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:insert="~{header :: navbar}"></nav>

<div class="main-content">
    <div th:if="${bookingsReserved.isEmpty() && bookings.isEmpty()}" class="no-booking-container">
        <img th:src="@{/img/emptySpace/disco-party.png}" alt="" class="filler-image" width="1024" height="1024"/>
        <h1 class="no-bookings">There are currently no Bookings</h1>
        <p class="cta-no-bookings">for any of your events</p>
    </div>

    <div th:if="${!bookingsReserved.isEmpty()}">
        <h1>Confirmed Bookings</h1>
        <p class="infoText">Bookings which have been confirmed by the landlord.</p>
        <table style="width: 100%">
            <thead>
            <tr>
                <th width="20%">House</th>
                <th width="5%"></th>
                <th width="8%">Type</th>
                <th width="10%">Details</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${bookingsReserved}">
                <td>
                    <a th:if="${entry.key.getRentalInformation().getHouse() != null}"
                       th:href="@{/house/{id}(id=${entry.key.getRentalInformation().getHouse().getId()})}"
                       th:text="${entry.key.getRentalInformation().getHouse().getName()}" class="external_link">
                        <img th:src="@{/img/icons/information.png}" alt="time-icon" class="event-icon"
                             width="1024" height="1024"/></a>
                    <a th:if="${entry.key.getRentalInformation().getHouse() == null}" th:text="#{booking.details.house_deleted}" class="external_link">House Deleted</a>
                </td>
                <td><a th:href="@{/bookings/{id}(id=${entry.key.id})}" class="external_link">
                    <img th:src="@{/img/icons/information.png}" alt="time-icon" class="event-icon"
                         width="1024" height="1024"/></a></td>

                <td th:classappend="${entry.key.getRentalType().toString() == 'EVENT' ? 'type-event' :
                        (entry.key.getRentalType().toString() == 'PERSONAL' ? 'type-personal' :
                        (entry.key.getRentalType().toString() == 'TICKET' ? 'type-ticket' :
                        (entry.key.getRentalType().toString() == 'VACANT' ? 'type-vacant' :
                        (entry.key.getRentalType().toString() == 'ADVERTISING' ? 'type-advertising' : 'type-unknown'))))}"
                    th:text="${entry.key.getRentalType().toString() == 'EVENT' ? 'Event' :
                     (entry.key.getRentalType().toString() == 'PERSONAL' ? 'Persönlich' :
                     (entry.key.getRentalType().toString() == 'TICKET' ? 'Ticket' :
                     (entry.key.getRentalType().toString() == 'VACANT' ? 'Verfügbar' :
                     (entry.key.getRentalType().toString() == 'ADVERTISING' ? 'Werbung' : 'Unbekannt'))))}">
                </td>

                <td th:if="${entry.key.isEventBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:if="${entry.key.isPersonalBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:if="${entry.key.isAdvertisingBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:text="${entry.key.getRentalInformation().getStartDateString() + ' - ' + entry.key.getRentalInformation().getEndDateString() + ' (' + entry.key.getRentalInformation().getInterval().getDuration().toDays()} + ' ' + #{date.days} + ')'"></td>
                <td>
                    <form th:if="${!entry.key.isCanceled()}" th:action="@{/decline}" method="post" style="display: inline-block; margin-right: 10px;">
                        <input type="hidden" name="booking_id" th:value="${entry.key.getId()}">
                        <input type="hidden" name="origin" value="eventstaffrentals">
                        <input class="decline_button" type="submit" value="Cancel">
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${!bookings.isEmpty()}">
        <h1>All Bookings</h1>
        <table>
            <thead>
            <tr>
                <th width="20%">House</th>
                <th width="5%"></th>
                <th>Status</th>
                <th width="8%">Type</th>
                <th width="10%">Details</th>
                <th>Time</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${bookings}">
                <td>
                    <a th:if="${entry.key.getRentalInformation().getHouse() != null}"
                       th:href="@{/house/{id}(id=${entry.key.getRentalInformation().getHouse().getId()})}"
                       th:text="${entry.key.getRentalInformation().getHouse().getName()}" class="external_link">
                        <img th:src="@{/img/icons/information.png}" alt="time-icon" class="event-icon"
                             width="1024" height="1024"/>
                    </a>
                    <a th:if="${entry.key.getRentalInformation().getHouse() == null}" th:text="#{booking.details.house_deleted}" class="external_link">House Deleted</a>
                </td>
                <td><a th:href="@{/bookings/{id}(id=${entry.key.id})}" class="external_link">
                    <img th:src="@{/img/icons/information.png}" alt="time-icon" class="event-icon"
                         width="1024" height="1024"/>
                </a></td>

                <td th:classappend="${entry.key.getStatus().toString() == 'OPEN' ? 'status-open' :
                       (entry.key.getStatus().toString() == 'RESERVED' ? 'status-reserved' :
                       (entry.key.getStatus().toString() == 'PAID' ? 'status-paid' :
                       (entry.key.getStatus().toString() == 'COMPLETED' ? 'status-completed' :
                       (entry.key.getStatus().toString() == 'CANCELED' ? 'status-canceled' : 'status-unknown'))))}"
                    th:text="${entry.key.getStatus().toString() == 'OPEN' ? 'Offen' :
                     (entry.key.getStatus().toString() == 'RESERVED' ? 'Reserviert' :
                     (entry.key.getStatus().toString() == 'PAID' ? 'Bezahlt' :
                     (entry.key.getStatus().toString() == 'COMPLETED' ? 'Abgeschlossen' :
                     (entry.key.getStatus().toString() == 'CANCELED' ? 'Storniert' : 'Unbekannt'))))}">
                </td>


                <td th:classappend="${entry.key.getRentalType().toString() == 'EVENT' ? 'type-event' :
                        (entry.key.getRentalType().toString() == 'PERSONAL' ? 'type-personal' :
                        (entry.key.getRentalType().toString() == 'TICKET' ? 'type-ticket' :
                        (entry.key.getRentalType().toString() == 'VACANT' ? 'type-vacant' :
                        (entry.key.getRentalType().toString() == 'ADVERTISING' ? 'type-advertising' : 'type-unknown'))))}"
                    th:text="${entry.key.getRentalType().toString() == 'EVENT' ? 'Event' :
                     (entry.key.getRentalType().toString() == 'PERSONAL' ? 'Persönlich' :
                     (entry.key.getRentalType().toString() == 'TICKET' ? 'Ticket' :
                     (entry.key.getRentalType().toString() == 'VACANT' ? 'Verfügbar' :
                     (entry.key.getRentalType().toString() == 'ADVERTISING' ? 'Werbung' : 'Unbekannt'))))}">
                </td>

                <td th:if="${entry.key.isEventBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:if="${entry.key.isPersonalBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:if="${entry.key.isAdvertisingBooking()}">
                    <p th:text="${entry.value}"></p>
                </td>
                <td th:text="${entry.key.getRentalInformation().getStartDateString() + ' - ' + entry.key.getRentalInformation().getEndDateString() + ' (' + entry.key.getRentalInformation().getInterval().getDuration().toDays()} + ' ' + #{date.days} + ')'"></td>
                <td>
                    <form th:if="${!entry.key.getStatus().toString().equals('CANCELED')}" th:action="@{/decline}" method="post" style="display: inline-block; margin-right: 10px;">
                        <input type="hidden" name="booking_id" th:value="${entry.key.getId()}">
                        <input type="hidden" name="origin" value="eventstaffrentals">
                        <input class="decline_button" type="submit" value="Cancel">
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>


</div>

<footer th:insert="~{common/debug_footer :: time_controller(origin_type='eventstaffrentals', origin_id='null')}"></footer>
</body>
</html>
