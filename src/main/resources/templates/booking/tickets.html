<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tickets</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:insert="~{header :: navbar}"></nav>

    <div class="main-content">

        <div th:if="${ticketBookings.isEmpty()}" class="no-booking-container">
            <img th:src="@{/img/emptySpace/emptyTicket.png}" alt="" class="filler-image" width="1024" height="1024"/>
            <h1 class="no-bookings" th:text="#{bookings.tickets-empty_1}">You have no Tickets yet!</h1>
            <p class="cta-no-bookings" th:text="#{bookings.tickets-empty_2}">go and book something</p>
        </div>


        <div th:if="${!ticketBookings.isEmpty()}">
            <h1>Tickets</h1>
            <div class="card-container">
                <div class="booking-card" th:each="entry : ${ticketBookings}">
                    <h2 class="booking-event-name">
                        <a th:href="@{/event/{id}(id=${entry.value.id})}" th:text="${entry.value.name}"
                           class="external_link">Event Name</a>
                        <a th:href="@{/bookings/{id}(id=${entry.key.id})}" class="external_link">
                            <img th:src="@{/img/icons/information.png}" alt="event-details-icon" class="event-icon"
                                 width="64" height="64"/>
                        </a>
                    </h2>
                    <p class="ticket-amount"
                       th:text="${entry.key.getTickets()} + ' Tickets x ' + ${entry.key.bookingPrice}">Ticketanzahl</p>
                    <p class="status"
                       th:classappend="${entry.key.getStatus().toString() == 'OPEN' ? 'status-open' :
                   (entry.key.getStatus().toString() == 'RESERVED' ? 'status-reserved' :
                   (entry.key.getStatus().toString() == 'PAID' ? 'status-paid' :
                   (entry.key.getStatus().toString() == 'COMPLETED' ? 'status-completed' :
                   (entry.key.getStatus().toString() == 'CANCELED' ? 'status-canceled' : 'status-unknown'))))}"
                       th:text="${entry.key.getStatus().toString() == 'OPEN' ? 'Offen' :
                        (entry.key.getStatus().toString() == 'RESERVED' ? 'Reserviert' :
                        (entry.key.getStatus().toString() == 'PAID' ? 'Bezahlt' :
                        (entry.key.getStatus().toString() == 'COMPLETED' ? 'Abgeschlossen' :
                        (entry.key.getStatus().toString() == 'CANCELED' ? 'Storniert' : 'Unbekannt'))))}">
                    </p>

                    <p class="time"
                       th:text="${entry.value.getStartDateString() + ' - ' + entry.value.getEndDateString() + ' (' + entry.value.getInterval().getDuration().toDays()} + ' ' + #{date.days} + ')'">
                        Eventzeitraum
                    </p>

                    <div class="actions"
                         th:if="${!entry.key.getStatus().toString().equals('CANCELED') and !entry.key.getStatus().toString().equals('COMPLETED')}"
                         style="margin-top: 1rem">
                        <form th:action="@{/decline}" method="post">
                            <input type="hidden" name="booking_id" th:value="${entry.key.getId()}">
                            <input type="hidden" name="origin" value="tickets">
                            <input class="decline_button" type="submit" value="Cancel">
                        </form>

                        <form th:action="@{/tickets/refund/{id}(id=${entry.key.id})}" method="get">
                            <input class="silent-del" type="submit" value="Refund">
                        </form>
                    </div>
                </div>
            </div>
        </div>


    </div>
</body>
</html>
