<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:fragment="add_comment(product, type)" th:if="${customerAllowedToComment}" sec:authorize="hasRole('Customer')" style="margin-top: 40px;">
    <div class="text-field-container">
        <h2 class="standard-header-2" th:text="#{comment.cta}"></h2>
        <form style="max-width: 30rem; display: flex; flex-direction: column"
              th:action="@{/comment/{id}(id=${product.id})}" method="post" role="form" class="ui form" id="commentForm"
              th:object="${commentForm}">
            <div class="comment-rating">
                <input type="radio" id="star5" name="rating" value="5" />
                <label for="star5" title="5 stars" class="star">
                    <img alt="★" class="star" th:src="@{/img/icons/star.png}">
                </label>

                <input type="radio" id="star4" name="rating" value="4" />
                <label for="star4" title="4 stars" class="star">
                    <img alt="★" class="star" th:src="@{/img/icons/star.png}">
                </label>

                <input type="radio" id="star3" name="rating" value="3" />
                <label for="star3" title="3 stars" class="star">
                    <img alt="★" class="star" th:src="@{/img/icons/star.png}">
                </label>

                <input type="radio" id="star2" name="rating" value="2" />
                <label for="star2" title="2 stars" class="star">
                    <img alt="★" class="star" th:src="@{/img/icons/star.png}">
                </label>

                <input type="radio" id="star1" name="rating" value="1" />
                <label for="star1" title="1 star" class="star">
                    <img alt="★" class="star" th:src="@{/img/icons/star.png}">
                </label>
            </div>
            <label for="commentText"></label>
            <textarea class="form-input" id="commentText" name="commentText" th:field="*{text}" maxlength="254" th:errorclass="fieldError"
                      required="required" style="margin: 0">Comment</textarea>
            <input type="hidden" name="typeString" th:value="${type}">
            <button type="submit"
                    style="border: none; background: none; padding: 0; cursor: pointer; margin-left: auto">
                <img alt="Send" class="icon" th:src="@{/img/icons/send.png}">
            </button>
        </form>
    </div>
</div>


<div th:fragment="show_comments(product)" style="margin-top: 40px;">
    <br/>
    <h2 class="standard-header-2" th:text="#{comment.overview.header}"></h2>
    <div th:if="${product.getAverageRating() != null  and product.getAverageRating() != null}"
         style="display: flex; flex-direction: row; align-items: center; gap: 0.5rem">
        <p class="house-location"
           style="font-weight: 700"
           th:text="${product.getAverageRating()}"
        >
        </p>
        <img alt="Sternebewertung" class="star"
             th:src="@{/img/icons/star.png}"
             th:style="${product.getAverageRating() == 0.0 ? 'filter: saturate(0.2);' : 'filter: saturate(1);'}">
    </div>


    <div style="display: flex; flex-direction: column">
        <div th:each="comment : ${comments}" th:if="${!comments.isEmpty()}" class="comment-container">
            <p class="gänse"><img alt='"' class="striche" th:src='@{/img/icons/2striche.png}'/></p>
            <p class="enten"><img alt='"' class="striche" th:src='@{/img/icons/2striche.png}'/></p>

            <div class="stars-container" style="display: flex; justify-content: end">
            <span th:each="star : ${#numbers.sequence(1, 5)}">
                <img alt="Sternebewertung" class="star"
                     th:src="${star <= comment.getRating() ? '/img/icons/star.png' : '/img/icons/star.png'}"
                     th:style="${star <= comment.getRating() ? '' : 'opacity: 0.2;'}"/>
            </span>
            </div>

            <div>
                <p class="comment-text" th:text="${comment.text}">Text</p>
                <p th:if="${userIsOwner}" th:text=" '- ' + ${comment.getUsername()}" style="font-size: 1.5rem; ">
                    username</p>
            </div>

            <a sec:authorize="hasRole('Landlord') || hasRole('EventStaff')"
               th:if="${userIsOwner && !comment.isDeletionRequested()}" th:href="@{/requestCommentDeletion/{id}(id=${comment.id})}">
                <input type="image" th:src="@{/img/icons/delete.png}" name="" alt="" class="submit"
                       title="Löschung beantragen"
                       style="border-radius: 0; margin: auto; width: 2rem; height: 2rem; padding: 0; border: none">
            </a>

            <div sec:authorize="hasRole('Admin')">
                <a th:if="${comment.isDeletionRequested()}"
                   th:href="@{/declineCommentDeletion/{id}(id=${comment.id})}"> <input type="image" th:src="@{/img/icons/recoverDeletion.png}" name="" alt="" class="submit"
                           title="Nicht Löschen!"
                           style="border-radius: 0; margin: auto; width: 2rem; height: 2rem; padding: 0; border: none">
                </a>
                <a sec:authorize="hasRole('Admin')"
                   th:if="${comment.isDeletionRequested()}" th:href="@{/approveCommentDeletion/{id}(id=${comment.id})}">
                    <input type="image" th:src="@{/img/icons/delete.png}" name="" alt="" class="submit" title="Löschen!"
                           style="border-radius: 0; margin: auto; width: 2rem; height: 2rem; padding: 0; border: none">
                </a>
            </div>
        </div>
        <div th:if="${comments.isEmpty()}">
            <h6 th:text="#{comment.no_comments}"></h6>
        </div>
    </div>
</div>
</body>
</html>
